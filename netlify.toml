[build]
  publish = "public"

[functions]
  directory = "netlify/functions"

# Explicit rewrites keep the public API URLs stable and route them to Netlify Functions.
[[redirects]]
  from = "/api/items"
  to = "/.netlify/functions/items"
  status = 200
  force = true

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200
  force = true

[[redirects]]
  from = "/api/img/*"
  to = "/.netlify/functions/img/:splat"
  status = 200
  force = true

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200
  force = true

[functions."orders"]
  included_files = ["public/items-seed.json"]
